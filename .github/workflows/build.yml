name: build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      linux:
        description: 'Build Linux (.deb)'
        type: boolean
        default: true
      macos:
        description: 'Build macOS (.dmg)'
        type: boolean
        default: true
      archlinux:
        description: 'Build Arch Linux (.pkg.tar.zst)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows (installer .exe)'
        type: boolean
        default: true

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang ninja-build cmake \
            libwxgtk3.2-dev libgtk-3-dev \
            libcurl4-openssl-dev libsqlite3-dev \
            libsecret-1-dev \
            dpkg-dev file

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Package
        working-directory: build
        run: cpack

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: build/gritcode-*.deb

  macos:
    name: macOS
    # macOS 26 image (Xcode 26): an app built against the older SDK runs in
    # compatibility mode on Tahoe, with pre-Tahoe controls. The minimum
    # supported macOS is pinned separately (CMAKE_OSX_DEPLOYMENT_TARGET).
    runs-on: macos-26
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: brew install ninja cmake

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          echo "$CERT_BASE64" | base64 -d > developer-id.p12
          echo "p12 file size: $(wc -c < developer-id.p12) bytes"
          security create-keychain -p temp temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p temp temp.keychain
          security import developer-id.p12 -k temp.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp temp.keychain
          security list-keychains -d user -s temp.keychain $(security list-keychains -d user | sed 's/"//g')
          echo "Imported identities:"
          security find-identity -v -p codesigning temp.keychain
          rm developer-id.p12

      - name: Sign .app with Developer ID
        run: |
          IDENTITY=$(security find-identity -v -p codesigning temp.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Signing with: $IDENTITY"
          app="build/gritcode.app"
          codesign --force --sign "$IDENTITY" --options runtime --timestamp --deep "$app"

      - name: Package
        working-directory: build
        run: cpack

      - name: Sign .dmg
        run: |
          IDENTITY=$(security find-identity -v -p codesigning temp.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          DMG=$(ls build/gritcode-*.dmg | head -1)
          codesign --force --sign "$IDENTITY" --options runtime --timestamp "$DMG"

      - name: Notarize .dmg
        env:
          APPLE_ID: luke@devmindscape.com
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASS: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          DMG=$(ls build/gritcode-*.dmg | head -1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PASS" \
            --wait

      - name: Staple notarization ticket
        run: |
          DMG=$(ls build/gritcode-*.dmg | head -1)
          xcrun stapler staple "$DMG"

      - name: Upload .dmg
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: build/gritcode-*.dmg

  archlinux:
    name: Arch Linux
    # No native Arch runner exists; build inside the official Arch container.
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.archlinux }}
    steps:
      # actions/* are Node actions and run inside the container, so node + git
      # must exist there before checkout. pacman -Syu first (rolling image).
      - name: Install action prerequisites
        run: pacman -Syu --noconfirm --needed git nodejs

      - uses: actions/checkout@v6

      - name: Install build deps
        run: pacman -S --noconfirm --needed cmake ninja clang wxwidgets-gtk3 gtk3 curl sqlite libsecret hicolor-icon-theme

      - name: Build package
        run: |
          # Container git runs as root against a host-owned mount.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(sed -n 's/^project(gritcode VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          # Keep the PKGBUILD's pkgver in sync with CMakeLists.txt so a version
          # bump can't get the two out of step (which makes makepkg look for
          # the wrong tarball).
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/archlinux/PKGBUILD
          # Package the current checkout into the tarball the PKGBUILD expects,
          # so the build works on PRs (no tag required) as well as releases.
          git archive --format=tar.gz --prefix="gritcode-${VERSION}/" \
            -o "packaging/archlinux/gritcode-${VERSION}.tar.gz" HEAD
          # makepkg refuses to run as root; the container runs as root by default.
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/archlinux' && makepkg -f --noconfirm"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: archlinux-pkg
          path: packaging/archlinux/*.pkg.tar.zst

  windows:
    name: Windows
    runs-on: windows-latest
    # Windows builds are developed on the 'windows' branch only — disabled on
    # main (which also keeps main's tag releases Windows-free). The windows
    # branch carries an enabled copy of this job.
    if: ${{ github.ref_name == 'windows' && (github.event_name != 'workflow_dispatch' || inputs.windows) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install NSIS and Ninja
        run: choco install nsis ninja -y --no-progress

      # Ninja needs cl.exe on PATH; this sets up the VS developer environment
      # without pinning a specific Visual Studio version. setup-msvc-dev is a
      # maintained fork of ilammy/msvc-dev-cmd that runs on Node 24.
      - name: Set up MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install vcpkg deps
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          & $vcpkg install curl sqlite3 --triplet x64-windows

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      # Launch the built exe briefly: a WIN32-subsystem app that dies at
      # startup is otherwise silent. The app logs its startup path to
      # %TEMP%\gritcode-startup.log.
      - name: Smoke run
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build-win\gritcode.exe" -PassThru
          Start-Sleep -Seconds 8
          $log = Join-Path $env:TEMP "gritcode-startup.log"
          if (Test-Path $log) {
            Write-Output "=== gritcode-startup.log ==="
            Get-Content $log
          } else {
            Write-Output "(no startup log written)"
          }
          if ($p.HasExited) {
            Write-Output "SMOKE FAIL: gritcode.exe exited with code $($p.ExitCode)"
            exit 1
          }
          Write-Output "SMOKE OK: still running after 8s"
          Stop-Process -Id $p.Id -Force

      - name: Package
        run: cmake --build --preset windows-release --target package

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: build-win/gritcode-*.exe

  release:
    name: Publish GitHub Release
    # Windows is not built from main (job is branch-gated); a skipped needed
    # job would skip this one too.
    needs: [linux, macos, archlinux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete stale releases for this tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A suffixed tag (e.g. v0.5.14-rc1) publishes as a pre-release;
          # plain version tags (v0.5.14) publish normally.
          set -- --generate-notes --title "$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            *-*) set -- --prerelease "$@" ;;
          esac
          gh release create "$GITHUB_REF_NAME" artifacts/* "$@"
